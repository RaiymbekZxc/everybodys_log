<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network | Everyone's Log</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="network">
  <div class="app-shell">
    <aside class="side-panel">
      <div class="brand">
        <span class="brand-mark">P5</span>
        <div>
          <h1>Everyone's Log</h1>
          <p>Persona activity network</p>
        </div>
      </div>
      <nav class="nav" aria-label="Primary">
        <a class="nav-btn" href="index.html">Dashboard</a>
        <a class="nav-btn" href="activity.html">Activity Log</a>
        <a class="nav-btn active" href="network.html">Network</a>
        <a class="nav-btn" href="profile.html">Profile</a>
        <a class="nav-btn" href="admin.html">Admin</a>
      </nav>
      <div class="session-card">
        <span id="sessionStatus">Signed in</span>
        <button id="quickLogout" type="button">Logout</button>
      </div>
    </aside>

    <main class="main-panel">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="topline">
        <div>
          <p class="eyebrow">Public posts</p>
          <h2>Network</h2>
        </div>
        <button id="refreshPosts" type="button">Refresh</button>
      </div>

      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="1">Productivity</button>
        <button class="filter" data-filter="2">Social Life</button>
        <button class="filter" data-filter="3">Leisure</button>
      </div>
      <div class="post-list" id="postList"></div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
