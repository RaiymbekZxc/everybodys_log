<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Everyone's Log</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="register">
  <div class="app-shell auth-shell">
    <aside class="side-panel">
      <div class="brand">
        <span class="brand-mark">P5</span>
        <div>
          <h1>Everyone's Log</h1>
          <p>Persona activity network</p>
        </div>
      </div>

      <nav class="nav" aria-label="Account">
        <a class="nav-btn" href="login.html">Sign In</a>
        <a class="nav-btn active" href="register.html">Register</a>
      </nav>

    </aside>

    <main class="main-panel">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <form class="panel auth-panel" id="registerForm">
        <h2>Create Account</h2>
        <label>
          Username
          <input id="registerUsername" autocomplete="username" required>
        </label>
        <label>
          Email
          <input id="registerEmail" type="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input id="registerPassword" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="primary" type="submit">Register</button>
        <p class="switch-link">Already registered? <a href="login.html">Sign in</a></p>
      </form>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
