<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Everyone's Log</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="admin">
  <div class="app-shell">
    <aside class="side-panel">
      <div class="brand">
        <span class="brand-mark">P5</span>
        <div>
          <h1>Everyone's Log</h1>
          <p>Persona activity network</p>
        </div>
      </div>
      <nav class="nav" aria-label="Primary">
        <a class="nav-btn" href="index.html">Dashboard</a>
        <a class="nav-btn" href="activity.html">Activity Log</a>
        <a class="nav-btn" href="network.html">Network</a>
        <a class="nav-btn" href="profile.html">Profile</a>
        <a class="nav-btn active" href="admin.html">Admin</a>
      </nav>
      <div class="session-card">
        <span id="sessionStatus">Signed in</span>
        <button id="quickLogout" type="button">Logout</button>
      </div>
    </aside>

    <main class="main-panel">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="topline">
        <div>
          <p class="eyebrow">Admin tools</p>
          <h2>Users</h2>
        </div>
      </div>

      <form class="panel admin-panel" id="adminForm">
        <h3>Manage User</h3>
        <label>
          Username
          <input id="adminUsername" autocomplete="off" required>
        </label>
        <div class="admin-actions">
          <button class="primary" type="submit" data-action="giveadmin">Give Admin</button>
          <button type="submit" data-action="deactivate">Deactivate</button>
          <button class="danger" type="submit" data-action="delete">Delete</button>
        </div>
      </form>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
