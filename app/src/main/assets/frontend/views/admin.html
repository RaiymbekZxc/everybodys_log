<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    ```
    <link rel="stylesheet" href="../styles/style.css">

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    ```

</head>

<body class="admin-page">

<div class="profile-content">

    ```
    <div class="profile-card">

        <div class="error" id="error"></div>

        <div class="success" id="success"></div>

        <div class="profile-row">

            <div class="profile-label">
                Username
            </div>

            <input
                    class="profile-edit-input"
                    type="text"
                    id="AdminUsername"
                    placeholder="Enter username">

        </div>

        <button
                class="profile-btn"
                onclick="giveAdmin()">
            Give Admin
        </button>

        <button
                class="profile-btn"
                onclick="deactivateUser()">
            Deactivate User
        </button>

        <button
                class="profile-btn"
                onclick="deleteUser()">
            Delete User
        </button>

    </div>
    ```

</div>

<button class="back-btn" onclick="history.back()">Back</button>

<script>

    async function verifyAdmin() {

        if (!getToken()) {

            window.location.href =
                "login.html";

            return;
        }

        try {

            const user =
                await apiFetch(
                    "/api/auth/users/me"
                );

            if (!user.IsAdmin) {

                window.location.href =
                    "main_page.html";
            }

        }
        catch (e) {

            console.error(e);

            window.location.href =
                "login.html";
        }
    }

    async function giveAdmin() {

        const username =
            document.getElementById(
                "AdminUsername"
            ).value.trim();

        if (!username) {

            document.getElementById("error")
                .textContent =
                "Enter a username.";

            return;
        }

        try {

            await apiFetch(
                `/api/admin/user/${username}/giveadmin`,
                {
                    method: "PUT"
                }
            );

            document.getElementById("error")
                .textContent = "";

            document.getElementById("success")
                .textContent =
                "User promoted to admin.";

            setTimeout(() => {

                document.getElementById("success")
                    .textContent = "";

            }, 3000);
        }
        catch (e) {

            console.error(e);

            document.getElementById("error")
                .textContent =
                e.message;
        }
    }

    async function deactivateUser() {

        const username =
            document.getElementById(
                "AdminUsername"
            ).value.trim();

        if (!username) {

            document.getElementById("error")
                .textContent =
                "Enter a username.";

            return;
        }

        try {

            await apiFetch(
                `/api/admin/user/${username}/deactivate`,
                {
                    method: "PUT"
                }
            );

            document.getElementById("error")
                .textContent = "";

            document.getElementById("success")
                .textContent =
                "User deactivated.";

            setTimeout(() => {

                document.getElementById("success")
                    .textContent = "";

            }, 3000);
        }
        catch (e) {

            console.error(e);

            document.getElementById("error")
                .textContent =
                e.message;
        }
    }

    async function deleteUser() {

    const username =
        document.getElementById("AdminUsername")
            .value.trim();

    console.log("DELETE USER:", username);

    try {

        const result =
            await apiFetch(
                `/api/admin/user/${username}/delete`,
                {
                    method: "DELETE"
                }
            );

        console.log("DELETE SUCCESS:", result);

        document.getElementById("success")
            .textContent =
            "User deleted successfully.";

    }
    catch (e) {

        console.error("DELETE FAILED:", e);

        console.error("MESSAGE:", e.message);

        document.getElementById("error")
            .textContent =
            e.message;
    }
}

</script>

</body>
</html>
