<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

<div class="activity-container">

    <div class="buttons navbar">
        <a class="link-wrapper option-btn" href="#">
            <span class="fallback">Productivity</span>
            <div class="img-wrapper">
                <img class="normal" src="https://i.imgur.com/H4JD35M.png">
                <img class="active" src="https://i.imgur.com/ELytdKg.png">
            </div>
            <div class="shape-wrapper">
                <div class="shape red-fill jelly">
                    <svg viewBox="0 0 108.1 47"><polygon fill="#FF0000" points="29.5,8.5 150.7,0 108.1,32.7 3.1,47"/></svg>
                </div>
                <div class="shape cyan-fill jelly">
                    <svg viewBox="0 0 108.1 47"><polygon fill="#00FFFF" points="0.3,17 125.1,0 68.8,45.6 24.3,39"/></svg>
                </div>
            </div>
        </a>

        <a class="link-wrapper option-btn" href="#">
            <span class="fallback">Social Life</span>
            <div class="img-wrapper">
                <img class="normal" src="https://i.imgur.com/H4JD35M.png">
                <img class="active" src="https://i.imgur.com/ELytdKg.png">
            </div>
            <div class="shape-wrapper">
                <div class="shape red-fill jelly">
                    <svg viewBox="0 0 108.1 47"><polygon fill="#FF0000" points="29.5,8.5 150.7,0 108.1,32.7 3.1,47"/></svg>
                </div>
                <div class="shape cyan-fill jelly">
                    <svg viewBox="0 0 108.1 47"><polygon fill="#00FFFF" points="0.3,17 125.1,0 68.8,45.6 24.3,39"/></svg>
                </div>
            </div>
        </a>

        <a class="link-wrapper option-btn" href="#">
            <span class="fallback">Leisure</span>
            <div class="img-wrapper">
                <img class="normal" src="https://i.imgur.com/H4JD35M.png">
                <img class="active" src="https://i.imgur.com/ELytdKg.png">
            </div>
            <div class="shape-wrapper">
                <div class="shape red-fill jelly">
                    <svg viewBox="0 0 108.1 47"><polygon fill="#FF0000" points="29.5,8.5 150.7,0 108.1,32.7 3.1,47"/></svg>
                </div>
                <div class="shape cyan-fill jelly">
                    <svg viewBox="0 0 108.1 47"><polygon fill="#00FFFF" points="0.3,17 125.1,0 68.8,45.6 24.3,39"/></svg>
                </div>
            </div>
        </a>
    </div>

    <div class="textbox-container" id="textboxContainer">
            <textarea
                    id="message"
                    maxlength="100"
                    placeholder="Enter one sentence..."
            ></textarea>

        <div class="counter">
            <span id="charCount">0</span>/100
        </div>
    </div>

    <button class="send-btn" id="sendBtn">
        Send
    </button>

</div>

<script>
    const buttons = document.querySelectorAll(".option-btn");
    const textboxContainer = document.getElementById("textboxContainer");
    const textarea = document.getElementById("message");
    const charCount = document.getElementById("charCount");
    const sendBtn = document.getElementById("sendBtn");

    buttons.forEach(button => {
      button.addEventListener("click", (e) => {
        e.preventDefault();

        // Удаляем класс active у всех, чтобы остановить их анимацию
        buttons.forEach(btn => btn.classList.remove("active"));

        // Добавляем класс текущей кнопке — теперь она будет "светиться" и двигаться
        button.classList.add("active");

        textboxContainer.style.display = "flex";
      });
    });

    textarea.addEventListener("input", () => {
      charCount.textContent = textarea.value.length;
    });

    // Обработчик кнопки отправки (пока пустой, чтобы не было ошибок)
    sendBtn.addEventListener("click", () => {
      console.log("Кнопка нажата, логика отправки будет добавлена позже.");
    });
</script>

</body>
</html>
