<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<div class="menu-container">

    <div class="navbar">

        <a href="profile.html" class="send-btn">Profile</a>

        <a href="activity_log_config.html" class="send-btn">Activity Log</a>

        <a href="PAGE_3.html" class="send-btn">Button 3</a>

        <a href="PAGE_4.html" class="send-btn">Button 4</a>

    </div>

</div>

<script>
    const buttons = document.querySelectorAll(".option-btn");

    function openPage1() {
        window.location.href = "profile.html";
    }

    function openPage2() {
        window.location.href = "activity_log_config.html";
    }

    function openPage3() {
        window.location.href = "PAGE_3.html";
    }

    function openPage4() {
        window.location.href = "PAGE_4.html";
    }

    buttons.forEach(button => {
        button.addEventListener("click", (e) => {
            e.preventDefault();

            buttons.forEach(btn => btn.classList.remove("active"));

            button.classList.add("active");
        });
    });
</script>

</body>
</html>
